function _stuByClass(){
  if(!S.rptStuClass)return S.students;
  const[gl,r]=S.rptStuClass.split('_');
  return S.students.filter(s=>String(s.grade_level)===gl&&String(s.room)===r);
}
function _showSuggestions(val){
  const sl=$('rpt-stu-suggest');if(!sl)return;
  const kw=(val||'').trim().toLowerCase();
  if(!kw){sl.style.display='none';sl.innerHTML='';return}
  const pool=_stuByClass();
  const hits=pool.filter(s=>s.student_name.toLowerCase().includes(kw)||(s.student_code||'').toLowerCase().includes(kw)).slice(0,15);
  if(!hits.length){
    sl.innerHTML='<div class="suggest-empty">ไม่พบนักเรียน</div>';
  }else{
    sl.innerHTML=hits.map(s=>`<div class="suggest-item" onmousedown="_selectRptStu('${s.id}','${esc(s.student_name).replace(/'/g,"\\'")}')"><div class="suggest-name">${esc(s.student_name)}</div><div class="suggest-meta">${esc(s.student_code||'')} · ${classLabel(s.grade_level,s.room)}</div></div>`).join('');
  }
  sl.style.display='block';
}
function _selectRptStu(id,name){
  S.rptStuId=id;S.rptStuSearch=name;
  const inp=$('rpt-stu-search-inp');if(inp)inp.value=name;
  const sl=$('rpt-stu-suggest');if(sl){sl.style.display='none';sl.innerHTML=''}
  _renderStuSelectedTag(name);
  _loadRptStudentData();
}
function _renderStuSelectedTag(name){
  const wrap=$('rpt-stu-tag-wrap');if(!wrap)return;
  wrap.innerHTML=`<div class="suggest-selected-tag"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>${esc(name)}<button onclick="_clearRptStu()" title="ล้าง">✕</button></div>`;
}
function _clearRptStu(){
  S.rptStuId=null;S.rptStuSearch='';
  const inp=$('rpt-stu-search-inp');if(inp){inp.value='';inp.focus();}
  const wrap=$('rpt-stu-tag-wrap');if(wrap)wrap.innerHTML='';
  const sl=$('rpt-stu-suggest');if(sl){sl.style.display='none';sl.innerHTML=''}
  _renderClassStudentList();
}
function _onRptClassChange(val){
  S.rptStuClass=val||null;
  S.rptStuId=null;S.rptStuSearch='';
  const inp=$('rpt-stu-search-inp');if(inp)inp.value='';
  const wrap=$('rpt-stu-tag-wrap');if(wrap)wrap.innerHTML='';
  const sl=$('rpt-stu-suggest');if(sl){sl.style.display='none';sl.innerHTML=''}
  _renderClassStudentList();
}
let _stuPickList=[];
function _renderClassStudentList(){
  const body=$('rpt-stu-body');if(!body)return;
  if(!S.rptStuClass){
    body.innerHTML='<div class="empty-state">เลือกชั้นเรียน หรือพิมพ์ชื่อเพื่อค้นหานักเรียน</div>';return;
  }
  const[gl,r]=S.rptStuClass.split('_');
  _stuPickList=S.students.filter(s=>String(s.grade_level)===gl&&String(s.room)===r);
  if(!_stuPickList.length){body.innerHTML='<div class="empty-state">ไม่พบนักเรียนในชั้นนี้</div>';return}
  const chevSvg=`<svg class="card-row-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>`;
  let h=`<div style="font-size:12px;font-weight:600;color:var(--txt3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;padding:0 2px">${classLabel(gl,r)} · ${_stuPickList.length} คน</div><div class="card">`;
  _stuPickList.forEach((s,i)=>{
    h+=`<div class="card-row" onclick="_pickStu(${i})"><div class="card-row-info"><div class="card-row-name">${esc(s.student_name)}</div><div class="card-row-sub">${esc(s.student_code||'')}</div></div>${chevSvg}</div>`;
  });
  h+='</div>';
  body.innerHTML=h;
}
function _pickStu(i){const s=_stuPickList[i];if(s)_selectRptStu(s.id,s.student_name);}
async function _loadRptStudentData(){
  if(!S.rptStuId){$('rpt-stu-body').innerHTML='<div class="empty-state">เลือกนักเรียนเพื่อดูประวัติ</div>';return}
  $('rpt-stu-body').innerHTML='<div class="loading-text">กำลังโหลด...</div>';
  try{
    let qb=sb.from('activity_attend').select('date,session,status,activities(name)').eq('student_id',S.rptStuId).order('date',{ascending:false}).order('session');
    if(S.rptStuActivityId) qb=qb.eq('activity_id',S.rptStuActivityId);
    const rows=await q(qb);
    if(!rows.length){$('rpt-stu-body').innerHTML='<div class="empty-state">ยังไม่มีข้อมูลการเข้าร่วมกิจกรรม</div>';return}
    const stu=S.students.find(s=>s.id===S.rptStuId)||{};
    S.rptStuData={rows,stu};
    const pr=rows.filter(r=>r.status==='present').length,la=rows.filter(r=>r.status==='late').length,ab=rows.filter(r=>r.status==='absent').length;
    let h=`<div class="stu-stat-cards">
      <div class="stat-mini green"><div class="sn">${pr}</div><div class="sl">มา</div></div>
      <div class="stat-mini orange"><div class="sn">${la}</div><div class="sl">สาย</div></div>
      <div class="stat-mini red"><div class="sn">${ab}</div><div class="sl">ขาด</div></div>
    </div>
    <div class="table-wrap"><table class="rpt-table">
      <thead><tr><th>วันที่</th><th>กิจกรรม</th><th>รอบ</th><th>สถานะ</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const b=r.status==='present'?`<span class="badge green">มา</span>`:r.status==='late'?`<span class="badge orange">สาย</span>`:`<span class="badge red">ขาด</span>`;
      h+=`<tr><td>${thDate(r.date)}</td><td class="left">${esc(r.activities?.name||'')}</td><td>${r.session==='morning'?'เช้า':'บ่าย'}</td><td>${b}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
    const _stuDocH=`<div style="text-align:center;border-bottom:2px solid #e5e7eb;padding-bottom:12px;margin-bottom:14px">
      <div style="font-size:17px;font-weight:700;color:#111827">${esc(S.schoolName)}</div>
      <div style="font-size:13px;font-weight:600;color:#374151;margin-top:4px">รายงานการเข้าร่วมกิจกรรม รายนักเรียน</div>
      <div style="font-size:13px;color:#6b7280;margin-top:3px">${esc(stu.student_name||'')}${stu.student_code?` · ${esc(stu.student_code)}`:''}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:3px">มา ${pr} · สาย ${la} · ขาด ${ab} ครั้ง</div>
    </div>`;
    $('rpt-stu-body').innerHTML=_expBar('exportStuPDF','exportStuExcel','exportStuImage')+`<div id="rpt-stu-doc" style="background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:20px">${_stuDocH}${h}</div>`;
  }catch(e){$('rpt-stu-body').innerHTML=`<div class="empty-state">เกิดข้อผิดพลาด: ${esc(e.message)}</div>`}
}
async function renderRptStudent(){
  const cOpts=S.classes.map(c=>`<option value="${c.grade_level}_${c.room}"${S.rptStuClass===`${c.grade_level}_${c.room}`?' selected':''}>${classLabel(c.grade_level,c.room)}</option>`).join('');
  const aOpts=S.activities.map(a=>`<option value="${a.id}"${S.rptStuActivityId==a.id?' selected':''}>${esc(a.name)}</option>`).join('');
  $('rpt-content').innerHTML=`
    <div class="filter-row">
      <select class="ios-select" onchange="S.rptStuActivityId=+this.value||null;_loadRptStudentData()">${'<option value="">ทุกกิจกรรม</option>'+aOpts}</select>
    </div>
    <div class="suggest-wrap">
      <input id="rpt-stu-search-inp" type="text" class="ios-input" placeholder="🔍 ค้นหาชื่อ / รหัสนักเรียน..."
        value="${esc(S.rptStuId?S.rptStuSearch:S.rptStuSearch||'')}"
        oninput="S.rptStuId=null;S.rptStuSearch=this.value;_showSuggestions(this.value)"
        onblur="setTimeout(()=>{const sl=$('rpt-stu-suggest');if(sl)sl.style.display='none'},200)"
        autocomplete="off">
      <div id="rpt-stu-suggest" class="suggest-list"></div>
    </div>
    <div id="rpt-stu-tag-wrap"></div>
    <div class="filter-row">
      <select class="ios-select" onchange="_onRptClassChange(this.value)">${'<option value="">-- ทุกชั้นเรียน --</option>'+cOpts}</select>
    </div>
    <div id="rpt-stu-body"><div class="loading-text">กำลังโหลด...</div></div>`;
  if(S.rptStuId){_renderStuSelectedTag(S.rptStuSearch);await _loadRptStudentData();}
  else _renderClassStudentList();
}

// ── Report: per class ──
async function renderRptClass(){
  if(!S.rptClassDate) S.rptClassDate=todayStr();
  const aOpts=S.activities.map(a=>`<option value="${a.id}"${S.rptClassActivityId==a.id?' selected':''}>${esc(a.name)}</option>`).join('');
  const cOpts=S.classes.map(c=>`<option value="${c.grade_level}_${c.room}"${S.rptClassClass===`${c.grade_level}_${c.room}`?' selected':''}>${classLabel(c.grade_level,c.room)}</option>`).join('');
  const selAct=S.activities.find(a=>a.id==S.rptClassActivityId);
  const ev=selAct?.has_evening;
  $('rpt-content').innerHTML=`
    <div class="filter-row">
      <select class="ios-select" onchange="S.rptClassActivityId=+this.value||null;renderRptClass()">${'<option value="">-- เลือกกิจกรรม --</option>'+aOpts}</select>
    </div>
    <div class="filter-row">
      <select class="ios-select" onchange="S.rptClassClass=this.value||null;renderRptClass()">${'<option value="">-- เลือกชั้นเรียน --</option>'+cOpts}</select>
    </div>
    <div class="filter-row" style="flex-direction:row;gap:8px;align-items:center">
      <input type="date" class="ios-input" style="flex:1" value="${S.rptClassDate}" onchange="S.rptClassDate=this.value;renderRptClass()">
      ${ev?`<div class="seg-ctrl"><button class="${S.rptClassSession==='morning'?'active':''}" onclick="S.rptClassSession='morning';renderRptClass()">เช้า</button><button class="${S.rptClassSession==='evening'?'active':''}" onclick="S.rptClassSession='evening';renderRptClass()">บ่าย</button></div>`:''}
    </div>
    <div id="rpt-class-body">${(!S.rptClassActivityId||!S.rptClassClass)?'<div class="empty-state">เลือกกิจกรรมและชั้นเรียนเพื่อดูรายงาน</div>':'<div class="loading-text">กำลังโหลด...</div>'}</div>`;
  if(!S.rptClassActivityId||!S.rptClassClass)return;
  const _rptClsKey=`${S.rptClassActivityId}_${S.rptClassClass}_${S.rptClassDate}_${S.rptClassSession}`;
  if(S.rptClassCacheKey===_rptClsKey&&S.rptClassData?.bodyHtml){$('rpt-class-body').innerHTML=S.rptClassData.bodyHtml;return}
  try{
    const session=ev?S.rptClassSession:'morning';
    const[gl,room]=S.rptClassClass.split('_');
    const classStudents=S.students.filter(s=>String(s.grade_level)===gl&&String(s.room)===room);
    const rows=await q(sb.from('activity_attend').select('student_id,status').eq('activity_id',S.rptClassActivityId).eq('date',S.rptClassDate).eq('session',session));
    const aMap={};rows.forEach(r=>aMap[r.student_id]=r.status);
    const stuWithStatus=classStudents.map(s=>({...s,status:aMap[s.id]||'unrecorded'}));
    const pr=stuWithStatus.filter(s=>s.status==='present').length;
    const la=stuWithStatus.filter(s=>s.status==='late').length;
    const ab=stuWithStatus.filter(s=>s.status==='absent').length;
    const un=stuWithStatus.filter(s=>s.status==='unrecorded').length;
    const cls={gl,r:room};
    const sessLbl=session==='morning'?'รอบเช้า':'รอบบ่าย';
    S.rptClassData={stuWithStatus,act:selAct,cls,date:S.rptClassDate,session,sessLbl};
    let h=`<div class="stu-stat-cards" style="margin-bottom:12px">
      <div class="stat-mini green"><div class="sn">${pr}</div><div class="sl">มา</div></div>
      <div class="stat-mini orange"><div class="sn">${la}</div><div class="sl">สาย</div></div>
      <div class="stat-mini red"><div class="sn">${ab}</div><div class="sl">ขาด</div></div>
      <div class="stat-mini"><div class="sn" style="color:var(--txt3)">${un}</div><div class="sl">ไม่ได้เช็ค</div></div>
    </div>
    <div class="table-wrap"><table class="rpt-table">
      <thead><tr><th>#</th><th class="screen-hide">รหัส</th><th class="left">ชื่อ-สกุล</th><th>สถานะ</th></tr></thead><tbody>`;
    const _docH=`<div style="text-align:center;border-bottom:2px solid #e5e7eb;padding-bottom:12px;margin-bottom:14px">
      <div style="font-size:17px;font-weight:700;color:#111827">${esc(S.schoolName)}</div>
      <div style="font-size:13px;font-weight:600;color:#374151;margin-top:4px">รายงานการเข้าร่วมกิจกรรม รายห้องเรียน</div>
      <div style="font-size:13px;color:#6b7280;margin-top:3px">${classLabel(gl,room)} · ${esc(selAct?.name||'')} · ${thDate(S.rptClassDate)} · ${sessLbl}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:4px">มา ${pr} · สาย ${la} · ขาด ${ab} · ไม่ได้เช็ค ${un} คน</div>
    </div>`;
    stuWithStatus.forEach((s,i)=>{
      const b=s.status==='present'?`<span class="badge green">มา</span>`:s.status==='late'?`<span class="badge orange">สาย</span>`:s.status==='absent'?`<span class="badge red">ขาด</span>`:`<span style="color:var(--txt3);font-size:12px">—</span>`;
      h+=`<tr><td>${i+1}</td><td class="screen-hide">${esc(s.student_code||'')}</td><td class="left">${esc(s.student_name)}</td><td>${b}</td></tr>`;
    });
    h+=`</tbody></table></div>`;
    $('rpt-class-body').innerHTML=_expBar('exportClassPDF','exportClassExcel','exportClassImage')+`<div id="rpt-class-doc" style="background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:20px">${_docH}${h}</div>`;
    S.rptClassData.bodyHtml=$('rpt-class-body').innerHTML;S.rptClassCacheKey=_rptClsKey;
  }catch(e){$('rpt-class-body').innerHTML=`<div class="empty-state">เกิดข้อผิดพลาด: ${esc(e.message)}</div>`}
}

// ── Export: per class ──
function exportClassPDF(){
  if(!S.rptClassData){toast('กรุณาโหลดรายงานก่อน','er');return}
  const{stuWithStatus,act,cls,date,sessLbl}=S.rptClassData;
  const pr=stuWithStatus.filter(s=>s.status==='present').length,la=stuWithStatus.filter(s=>s.status==='late').length,ab=stuWithStatus.filter(s=>s.status==='absent').length;
  let trs='';
  stuWithStatus.forEach((s,i)=>{
    const st=s.status==='present'?'มา':s.status==='late'?'สาย':s.status==='absent'?'ขาด':'—';
    trs+=`<tr><td>${i+1}</td><td>${esc(s.student_code||'')}</td><td class="left">${esc(s.student_name)}</td><td>${st}</td></tr>`;
  });
  const body=`<div class="sr-header"><div class="sr-school">${esc(S.schoolName)}</div><div class="sr-title">รายงานการเข้าร่วมกิจกรรม รายห้องเรียน</div><div class="sr-act">${classLabel(cls.gl,cls.r)} · ${esc(act?.name||'')}</div><div class="sr-date">วันที่ ${thDate(date)} · ${sessLbl}</div></div>
    <div style="display:flex;gap:24px;margin-bottom:12px;font-size:13px"><span>มา: <strong style="color:#1a7c35">${pr}</strong></span><span>สาย: <strong style="color:#b35900">${la}</strong></span><span>ขาด: <strong style="color:#c0000a">${ab}</strong></span><span style="color:#888">รวม: ${stuWithStatus.length} คน</span></div>
    <table><thead><tr><th>#</th><th>รหัส</th><th>ชื่อ-สกุล</th><th>สถานะ</th></tr></thead><tbody>${trs}</tbody></table>`;
  _openPrintWin(`${classLabel(cls.gl,cls.r)} ${act?.name||''}`,body);
}
function exportClassExcel(){
  if(!S.rptClassData){toast('กรุณาโหลดรายงานก่อน','er');return}
  if(typeof XLSX==='undefined'){toast('XLSX ยังโหลดไม่เสร็จ','er');return}
  const{stuWithStatus,act,cls,date,sessLbl}=S.rptClassData;
  const a1=[[S.schoolName],[`${classLabel(cls.gl,cls.r)} · ${act?.name||''}`],[`วันที่: ${thDate(date)} · ${sessLbl}`],[],['#','รหัสนักเรียน','ชื่อ-สกุล','สถานะ']];
  stuWithStatus.forEach((s,i)=>a1.push([i+1,s.student_code||'',s.student_name,s.status==='present'?'มา':s.status==='late'?'สาย':s.status==='absent'?'ขาด':'ไม่ได้เช็ค']));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a1),classLabel(cls.gl,cls.r));
  XLSX.writeFile(wb,`รายห้อง_${classLabel(cls.gl,cls.r)}_${act?.name||''}_${date}.xlsx`);
  toast('ดาวน์โหลด Excel แล้ว');
}
function exportClassImage(){
  if(!S.rptClassData){toast('กรุณาโหลดรายงานก่อน','er');return}
  const{act,cls,date}=S.rptClassData;
  _captureImage('rpt-class-doc',`รายห้อง_${classLabel(cls.gl,cls.r)}_${act?.name||''}_${date}.png`);
}

// ── Report: school-wide ──
async function renderRptSchool(){
  const aOpts=S.activities.map(a=>`<option value="${a.id}"${S.rptActivityId==a.id?' selected':''}>${esc(a.name)}</option>`).join('');
  const selAct=S.activities.find(a=>a.id==S.rptActivityId);
  const ev=selAct?.has_evening;
  $('rpt-content').innerHTML=`
    <div class="filter-row">
      <select class="ios-select" onchange="S.rptActivityId=+this.value||null;renderRptSchool()">${'<option value="">-- เลือกกิจกรรม --</option>'+aOpts}</select>
      <input type="date" class="ios-input" value="${S.rptDate}" onchange="S.rptDate=this.value;renderRptSchool()">
      ${ev?`<div class="seg-ctrl"><button class="${S.rptSession==='morning'?'active':''}" onclick="S.rptSession='morning';renderRptSchool()">เช้า</button><button class="${S.rptSession==='evening'?'active':''}" onclick="S.rptSession='evening';renderRptSchool()">บ่าย</button></div>`:''}
    </div>
    <div id="rpt-school-body">${S.rptActivityId?'<div class="loading-text">กำลังโหลด...</div>':'<div class="empty-state">เลือกกิจกรรมเพื่อดูรายงานทั้งโรงเรียน</div>'}</div>`;
  if(!S.rptActivityId)return;
  const _rptSchKey=`${S.rptActivityId}_${S.rptDate}_${S.rptSession||'morning'}`;
  if(S.rptSchoolCacheKey===_rptSchKey&&S.rptSchoolData?.bodyHtml){$('rpt-school-body').innerHTML=S.rptSchoolData.bodyHtml;return}
  try{
    const session=ev?S.rptSession:'morning';
    const rows=await q(sb.from('activity_attend').select('student_id,status').eq('activity_id',S.rptActivityId).eq('date',S.rptDate).eq('session',session));
    const aM={};rows.forEach(r=>aM[r.student_id]=r.status);
    const classData={};
    S.classes.forEach(c=>{classData[`${c.grade_level}_${c.room}`]={gl:c.grade_level,r:c.room,stus:[],present:0,late:0,absent:0}});
    S.students.forEach(s=>{
      const k=`${s.grade_level}_${s.room}`;if(!classData[k])return;
      const st=aM[s.id]||'unrecorded';
      classData[k].stus.push({...s,status:st});
      if(st==='present')classData[k].present++;else if(st==='late')classData[k].late++;else if(st==='absent')classData[k].absent++;
    });
    const act=S.activities.find(a=>a.id==S.rptActivityId);
    const sessLbl=session==='morning'?'รอบเช้า':'รอบบ่าย';
    S.rptSchoolData={classData,act,sessLbl};
    const docHTML=buildSchoolDoc(classData,act,sessLbl);
    $('rpt-school-body').innerHTML=_expBar('exportSchoolPDF','exportSchoolExcel','exportSchoolImage')+docHTML;
    S.rptSchoolData.bodyHtml=$('rpt-school-body').innerHTML;S.rptSchoolCacheKey=_rptSchKey;
  }catch(e){$('rpt-school-body').innerHTML=`<div class="empty-state">เกิดข้อผิดพลาด: ${esc(e.message)}</div>`}
}

function buildSchoolDoc(classData,act,sessLbl){
  const entries=Object.values(classData).filter(c=>c.stus.length>0);
  let tot={total:0,present:0,late:0,absent:0};
  entries.forEach(c=>{tot.total+=c.stus.length;tot.present+=c.present;tot.late+=c.late;tot.absent+=c.absent});
  const pct=(n,d)=>d>0?(n/d*100).toFixed(1)+'%':'-';
  const totRec=tot.present+tot.late+tot.absent;

  let h=`<div class="school-report" id="school-report-doc">
    <div class="sr-header">
      <div class="sr-school">${esc(S.schoolName)}</div>
      <div class="sr-title">รายงานการเข้าร่วมกิจกรรม</div>
      <div class="sr-act">${esc(act?.name||'')}</div>
      <div class="sr-date">วันที่ ${thDate(S.rptDate)} · ${sessLbl}</div>
    </div>
    <div class="table-wrap"><table class="rpt-table">
      <thead><tr><th>ชั้น</th><th>ทั้งหมด</th><th>มา</th><th>สาย</th><th>ขาด</th><th>%มา</th></tr></thead>
      <tbody>`;
  entries.forEach(c=>{
    const rec=c.present+c.late+c.absent;
    if(rec===0){
      h+=`<tr><td class="left nowrap">${classLabel(c.gl,c.r)}</td><td>${c.stus.length}</td><td colspan="4" class="not-checked">ยังไม่เช็คชื่อ</td></tr>`;
    }else{
      h+=`<tr><td class="left nowrap">${classLabel(c.gl,c.r)}</td><td>${c.stus.length}</td><td class="green">${c.present}</td><td class="orange">${c.late}</td><td class="red">${c.absent}</td><td>${pct(c.present+c.late,rec)}</td></tr>`;
    }
  });
  h+=`<tr class="total-row"><td class="left">รวม</td><td>${tot.total}</td><td class="green">${tot.present}</td><td class="orange">${tot.late}</td><td class="red">${tot.absent}</td><td>${pct(tot.present+tot.late,totRec||tot.total)}</td></tr>`;
  h+=`</tbody></table></div>
  </div>`;

  // Page 2: absent list
  const abEntries=entries.filter(c=>c.stus.some(s=>s.status==='absent'||s.status==='late'));
  if(abEntries.length){
    h+=`<div class="sr-page2" id="school-report-absent">
      <div class="sr-p2-title">รายชื่อนักเรียนที่ขาด / สาย</div>
      <div class="sr-p2-sub">${esc(act?.name||'')} · ${thDate(S.rptDate)} · ${sessLbl}</div>`;
    abEntries.forEach(c=>{
      const notOk=c.stus.filter(s=>s.status==='absent'||s.status==='late');
      if(!notOk.length)return;
      h+=`<div class="sr-class-group">
        <div class="sr-class-hd">${classLabel(c.gl,c.r)} <span>(${notOk.length} คน)</span></div>`;
      notOk.forEach((s,i)=>{
        const b=s.status==='late'?'<span class="badge-sm orange">สาย</span>':'<span class="badge-sm red">ขาด</span>';
        h+=`<div class="sr-stu-row"><span class="sr-stu-num">${i+1}.</span><span class="sr-stu-code">${esc(s.student_code)}</span><span class="sr-stu-name">${esc(s.student_name)}</span>${b}</div>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  return h;
}

async function renderRptPercent(){
  const aOpts=S.activities.map(a=>`<option value="${a.id}"${S.rptPctActivityId==a.id?' selected':''}>${esc(a.name)}</option>`).join('');
  const cOpts=S.classes.map(c=>`<option value="${c.grade_level}_${c.room}"${S.rptPctClass===`${c.grade_level}_${c.room}`?' selected':''}>${classLabel(c.grade_level,c.room)}</option>`).join('');
  $('rpt-content').innerHTML=`
    <div class="filter-row">
      <select class="ios-select" onchange="S.rptPctActivityId=+this.value||null;renderRptPercent()">${'<option value="">ทุกกิจกรรม</option>'+aOpts}</select>
    </div>
    <div class="filter-row">
      <select class="ios-select" onchange="S.rptPctClass=this.value||null;renderRptPercent()">${'<option value="">ทุกชั้นเรียน</option>'+cOpts}</select>
    </div>
    <div class="filter-row" style="flex-direction:row;align-items:center;gap:8px">
      <span style="font-size:14px;color:var(--txt2);white-space:nowrap">เกณฑ์ร้อยละ</span>
      <input type="number" class="ios-input" style="width:76px;text-align:center;flex:none" min="0" max="100" value="${S.rptPctThreshold}" oninput="S.rptPctThreshold=Math.min(100,Math.max(0,+this.value||0))">
      <span style="font-size:14px;color:var(--txt2);flex:none">%</span>
    </div>
    <button class="pct-run-btn" onclick="renderRptPercent()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      ดูรายงาน
    </button>
    <div id="rpt-pct-body"><div class="loading-text">กำลังโหลด...</div></div>`;
  try{
    let qb=sb.from('activity_attend').select('student_id,status');
    if(S.rptPctActivityId) qb=qb.eq('activity_id',S.rptPctActivityId);
    const rows=await q(qb);
    if(!rows.length){$('rpt-pct-body').innerHTML='<div class="empty-state">ยังไม่มีข้อมูลการเช็คชื่อ</div>';return}
    const stuMap={};
    rows.forEach(r=>{
      if(!stuMap[r.student_id])stuMap[r.student_id]={present:0,late:0,absent:0};
      if(r.status==='present')stuMap[r.student_id].present++;
      else if(r.status==='late')stuMap[r.student_id].late++;
      else if(r.status==='absent')stuMap[r.student_id].absent++;
    });
    const thr=S.rptPctThreshold;
    let targetStudents=S.students;
    if(S.rptPctClass){const[gl,r]=S.rptPctClass.split('_');targetStudents=targetStudents.filter(s=>String(s.grade_level)===gl&&String(s.room)===r)}
    const below=targetStudents.filter(s=>{
      const d=stuMap[s.id];if(!d)return false;
      const total=d.present+d.late+d.absent;if(!total)return false;
      return(d.present+d.late)/total*100<thr;
    }).map(s=>{
      const d=stuMap[s.id];
      const total=d.present+d.late+d.absent;
      return{...s,...d,total,pct:total>0?(d.present+d.late)/total*100:0};
    });
    if(!below.length){
      $('rpt-pct-body').innerHTML=`<div class="empty-state">✓ ไม่มีนักเรียนที่เข้าร่วมต่ำกว่า ${thr}%</div>`;return;
    }
    const byClass={};
    below.forEach(s=>{
      const k=`${s.grade_level}_${s.room}`;
      if(!byClass[k])byClass[k]={gl:s.grade_level,r:s.room,stus:[]};
      byClass[k].stus.push(s);
    });
    const _pctAct=S.rptPctActivityId?S.activities.find(a=>a.id===S.rptPctActivityId):null;
    let h=`<div style="text-align:center;border-bottom:2px solid #e5e7eb;padding-bottom:12px;margin-bottom:14px">
      <div style="font-size:17px;font-weight:700;color:#111827">${esc(S.schoolName)}</div>
      <div style="font-size:13px;font-weight:600;color:#374151;margin-top:4px">รายงานร้อยละการเข้าร่วมกิจกรรม</div>
      ${_pctAct?`<div style="font-size:13px;color:#6b7280;margin-top:3px">กิจกรรม: ${esc(_pctAct.name)}</div>`:''}
      <div style="font-size:12px;color:#6b7280;margin-top:3px">พบ ${below.length} คน ที่มีร้อยละต่ำกว่า ${thr}%</div>
    </div>`;
    Object.values(byClass).forEach(cls=>{
      h+=`<div class="sr-class-group">
        <div class="sr-class-hd">${classLabel(cls.gl,cls.r)} <span>(${cls.stus.length} คน)</span></div>
        <div class="table-wrap"><table class="rpt-table">
          <thead><tr><th>#</th><th class="screen-hide">รหัส</th><th class="left">ชื่อ-สกุล</th><th>มา</th><th>สาย</th><th>ขาด</th><th>ร้อยละ</th></tr></thead><tbody>`;
      cls.stus.sort((a,b)=>a.pct-b.pct).forEach((s,i)=>{
        const pc=s.pct.toFixed(1);
        const cl=s.pct<50?'red':s.pct<70?'orange':'';
        h+=`<tr><td>${i+1}</td><td class="screen-hide">${esc(s.student_code||'')}</td><td class="left" style="white-space:nowrap">${esc(s.student_name)}</td><td class="green">${s.present}</td><td class="orange">${s.late}</td><td class="red">${s.absent}</td><td class="${cl}" style="font-weight:600">${pc}%</td></tr>`;
      });
      h+=`</tbody></table></div></div>`;
    });
    S.rptPctData={below,thr};
    $('rpt-pct-body').innerHTML=_expBar('exportPctPDF','exportPctExcel','exportPctImage')+`<div id="rpt-pct-doc" style="background:#fff;border-radius:10px;border:1px solid #e5e7eb;padding:20px">${h}</div>`;
  }catch(e){$('rpt-pct-body').innerHTML=`<div class="empty-state">เกิดข้อผิดพลาด: ${esc(e.message)}</div>`}
}

async function _captureImage(elId,filename){
  if(typeof html2canvas==='undefined'){toast('html2canvas ยังโหลดไม่เสร็จ','er');return}
  const el=$(elId);if(!el){toast('ไม่พบเอกสาร','er');return}
  loading(true);
  /* สร้าง off-screen wrapper ที่ไม่มีข้อจำกัดความกว้าง + บังคับ light-mode */
  const lightVars='--bg:#fff;--card:#fff;--card2:#F0F2F5;--txt:#111827;--txt2:#6B7280;--txt3:#9CA3AF;--sep:#E5E7EB;--primary:#2563EB;--primary-light:#EFF6FF;--nav:#fff;--green:#059669;--red:#DC2626;--orange:#D97706;--blue:#2563EB;--radius:12px;--radius-sm:8px;--shadow:0 1px 4px rgba(0,0,0,.07);';
  const wrap=document.createElement('div');
  wrap.style.cssText=`position:absolute;left:-10000px;top:0;background:#fff;padding:20px 40px 48px;width:auto;min-width:0;${lightVars}`;
  const clone=el.cloneNode(true);
  clone.style.cssText='background:#fff;overflow:visible;width:auto;';
  clone.querySelectorAll('.table-wrap').forEach(e=>{e.style.cssText='overflow:visible;width:auto;max-width:none;'});
  clone.querySelectorAll('table').forEach(t=>{t.style.width='auto';t.style.tableLayout='auto';});
  /* scale:2 → 1px border = 2px physical → ลด border เป็น 0.5px สำหรับ export */
  const capStyle=document.createElement('style');
  capStyle.textContent='table th,table td{border-width:0.5px !important;border-color:#666 !important}.screen-hide{display:table-cell !important}';
  wrap.appendChild(capStyle);
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  try{
    await new Promise(r=>setTimeout(r,150));
    const rect=wrap.getBoundingClientRect();
    const W=Math.max(wrap.scrollWidth,rect.width)+4;
    const H=Math.max(wrap.scrollHeight,rect.height)+4;
    const canvas=await html2canvas(wrap,{
      scale:2,useCORS:true,backgroundColor:'#ffffff',
      scrollX:-10000,scrollY:0,
      width:W,height:H,
      windowWidth:Math.max(W,1024),windowHeight:H,
    });
    const dataUrl=canvas.toDataURL('image/png');
    /* ลอง Web Share API ก่อน (มือถือ) */
    if(navigator.canShare){
      try{
        const res=await fetch(dataUrl);
        const blob=await res.blob();
        const file=new File([blob],filename,{type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:filename.replace(/_/g,' ').replace('.png','')});
          toast('แชร์รูปภาพแล้ว');
          return;
        }
      }catch(shareErr){
        if(shareErr.name==='AbortError')return; /* ผู้ใช้ยกเลิกการแชร์เอง */
      }
    }
    /* fallback: download */
    const a=document.createElement('a');a.href=dataUrl;a.download=filename;a.click();
    toast('ดาวน์โหลดรูปภาพแล้ว');
  }catch(e){toast('เกิดข้อผิดพลาด: '+e.message,'er')}
  finally{if(wrap.parentNode)wrap.parentNode.removeChild(wrap);loading(false)}
}

async function saveSchoolName(){
  const inp=$('admin-school-name-inp');
  const val=inp?inp.value.trim():'';
  if(!val){toast('กรุณากรอกชื่อโรงเรียน','er');return}
  loading(true);
  try{
    await q(sb.from('config').upsert({key:'school_name',value:val},{onConflict:'key'}));
    S.schoolName=val;
    const sn=$('side-school-name');if(sn)sn.textContent=val;
    const ts=$('topbar-sub');if(ts)ts.textContent=val;
    toast('บันทึกชื่อโรงเรียนแล้ว');
  }catch(e){toast('เกิดข้อผิดพลาด: '+e.message,'er')}
  finally{loading(false)}
}

function showActivityModal(idOrNull){
  const act=idOrNull!=null?S.activities.find(a=>a.id===idOrNull):null;
  $('modal-title').textContent=act?'แก้ไขกิจกรรม':'เพิ่มกิจกรรมใหม่';
  $('modal-act-id').value=act?.id||'';
  $('modal-act-name').value=act?.name||'';
  $('modal-act-desc').value=act?.description||'';
  $('modal-act-evening').checked=!!act?.has_evening;
  $('modal-act-active').checked=act?!!act.is_active:true;
  $('activity-modal').classList.add('open');
  setTimeout(()=>$('modal-act-name').focus(),100);
}
function closeActivityModal(){$('activity-modal').classList.remove('open')}

async function saveActivity(){
  const id=$('modal-act-id').value;
  const name=$('modal-act-name').value.trim();
  if(!name){toast('กรุณาใส่ชื่อกิจกรรม','er');return}
  const payload={name,description:$('modal-act-desc').value.trim(),has_evening:$('modal-act-evening').checked,is_active:$('modal-act-active').checked};
  loading(true);
  try{
    if(id){await q(sb.from('activities').update(payload).eq('id',+id))}
    else{await q(sb.from('activities').insert(payload))}
    await loadActivities();closeActivityModal();renderAdmin();
    toast(id?'บันทึกเรียบร้อย':'เพิ่มกิจกรรมแล้ว');
  }catch(e){toast('เกิดข้อผิดพลาด: '+e.message,'er')}
  finally{loading(false)}
}

async function deleteActivity(id){
  const act=S.activities.find(a=>a.id===id);
  if(!confirm(`ลบกิจกรรม "${act?.name||''}"?\n\nข้อมูลการเช็คชื่อทั้งหมดของกิจกรรมนี้จะถูกลบด้วย`))return;
  loading(true);
  try{
    await q(sb.from('activities').delete().eq('id',id));
    if(S.ckActivityId===id)S.ckActivityId=null;
    if(S.rptActivityId===id)S.rptActivityId=null;
    await loadActivities();renderAdmin();toast('ลบกิจกรรมแล้ว');
  }catch(e){toast('เกิดข้อผิดพลาด: '+e.message,'er')}
  finally{loading(false)}
}

// ─── AUTH ──────────────────────────────────────────────────────────────────
async function doLogin(){
  const email=$('login-email').value.trim();
  const pass=$('login-pass').value;
  const btn=$('login-btn');
  $('login-err').textContent='';
  if(!email||!pass){$('login-err').textContent='กรุณากรอกอีเมลและรหัสผ่าน';return}
  btn.disabled=true;btn.textContent='กำลังเข้าสู่ระบบ...';
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    $('login-overlay').style.display='none';
    $('logout-btn').style.display='';
    await loadAppData();
  }catch(e){
    $('login-err').textContent=e.message==='Invalid login credentials'?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':e.message;
  }finally{btn.disabled=false;btn.textContent='เข้าสู่ระบบ'}
}

function doLogout(){
  const m=$('logout-modal');m.style.display='flex';
  requestAnimationFrame(()=>m.style.opacity='1');
}
function closeLogoutModal(){$('logout-modal').style.display='none'}
async function confirmLogout(){
  closeLogoutModal();
  loading(true);
  try{
    await sb.auth.signOut();
    $('login-overlay').style.display='flex';
    $('logout-btn').style.display='none';
    $('login-pass').value='';
  }finally{loading(false)}
}

function renderUnifList(){

  const stus=S.students.filter(s=>String(s.grade_level)===gl&&String(s.room)===r);
  const viols=S.unifViolations.filter(v=>v.is_active);

  let h='';
  stus.forEach((s,i)=>{

    const st=chk.status||'';
    const note=chk.note||'';
    const selViols=chk.violations||[];
    const checkboxes=viols.map(v=>`<label class="unif-viol-chk${selViols.includes(v.id)?' checked':''}"><input type="checkbox"${selViols.includes(v.id)?' checked':''} onchange="setUnifViolationCheck('${s.id}',${v.id},this.checked)">${esc(v.name)}</label>`).join('');
    const failDetail=st==='fail'?`<div class="unif-fail-detail" style="margin-top:4px">
      ${viols.length?`<div class="unif-viol-grid">${checkboxes}</div>`:'<span style="font-size:11px;color:var(--txt3)">ยังไม่มีประเภทความผิด (เพิ่มในหน้า Admin)</span>'}
      <input type="text" placeholder="หมายเหตุเพิ่มเติม" value="${esc(note)}" maxlength="80"
        onchange="setUnifNote('${s.id}',this.value)" oninput="setUnifNote('${s.id}',this.value)">
    </div>`:'';
    h+=`<div class="unif-row${st?' status-'+st:''}" id="urow-${s.id}">
      <div class="unif-row-top">
        <div class="unif-info">

          <button class="ub pass${st==='pass'?' active':''}" onclick="setUnifStatus('${s.id}','pass')">✓<span class="ub-txt"> ผ่าน</span></button>
          <button class="ub fail${st==='fail'?' active':''}" onclick="setUnifStatus('${s.id}','fail')">✗<span class="ub-txt"> ไม่ผ่าน</span></button>
          <button class="ub absent${st==='absent'?' active':''}" onclick="setUnifStatus('${s.id}','absent')">ข<span class="ub-txt"> ขาด</span></button>
        </div>
      </div>
      ${failDetail}
    </div>`;
  });
  $('unif-list').innerHTML=h||`<div class="empty-state">ไม่พบนักเรียนในชั้นนี้</div>`;
  updateUnifStats(S.unifChecks);
}

function updateUnifStats(checks){
  const[gl,r]=(S.unifClass||'_').split('_');
  const total=S.unifClass?S.students.filter(s=>String(s.grade_level)===gl&&String(s.room)===r).length:0;
  const vals=Object.values(checks||{});
  const pass=vals.filter(v=>v.status==='pass').length;
  const fail=vals.filter(v=>v.status==='fail').length;
  const absent=vals.filter(v=>v.status==='absent').length;
  const none=total-pass-fail-absent;
  $('unif-stats').innerHTML=`
    <div class="unif-stat"><div class="unif-stat-val">${total}</div><div class="unif-stat-lbl">ทั้งหมด</div></div>
    <div class="unif-stat"><div class="unif-stat-val" style="color:var(--green)">${pass}</div><div class="unif-stat-lbl">ผ่าน</div></div>
    <div class="unif-stat"><div class="unif-stat-val" style="color:var(--red)">${fail}</div><div class="unif-stat-lbl">ไม่ผ่าน</div></div>
    <div class="unif-stat"><div class="unif-stat-val" style="color:#6B7280">${absent}</div><div class="unif-stat-lbl">ขาด</div></div>
    <div class="unif-stat"><div class="unif-stat-val" style="color:var(--txt3)">${none}</div><div class="unif-stat-lbl">ยังไม่ตรวจ</div></div>`;
}

let _confirmCb=null;
function showConfirm(title,msg,onOk){
  $('confirm-title').textContent=title;
  $('confirm-msg').textContent=msg;
  _confirmCb=onOk;
  $('confirm-dialog').classList.add('open');
}
function _confirmOk(){$('confirm-dialog').classList.remove('open');const cb=_confirmCb;_confirmCb=null;if(cb)cb();}
function _confirmCancel(){$('confirm-dialog').classList.remove('open');_confirmCb=null;}

async function clearUnifClass(){
  if(!S.unifClass){toast('กรุณาเลือกชั้นเรียนก่อน','er');return}
  const checked=Object.keys(S.unifChecks).length;
  if(!checked){toast('ไม่มีข้อมูลการตรวจ','');return}
  const[gl,r]=S.unifClass.split('_');
  const clsName=classLabel(gl,r);
  showConfirm(
    'ล้างค่าการตรวจทั้งห้อง',
    `ล้างผลการตรวจ ${clsName} วันที่ ${S.unifDate} ทั้งหมด ${checked} คน ไม่สามารถเรียกคืนได้`,
    async()=>{
      loading(true);
      try{
        const ids=Object.values(S.unifChecks).filter(c=>c.id).map(c=>c.id);
        if(ids.length) await q(sb.from('uniform_checks').delete().in('id',ids));
        S.unifChecks={};renderUnifList();toast('ล้างค่าเรียบร้อย');
      }catch(e){toast('ลบไม่สำเร็จ: '+e.message,'er')}
      finally{loading(false)}
    }
  );
}

async function setUnifStatus(stuId,status){
  const key=String(stuId);
  const prev=S.unifChecks[key]||{};
  if(prev.status===status){
    if(prev.id){try{await q(sb.from('uniform_checks').delete().eq('id',prev.id))}catch(e){}}
    delete S.unifChecks[key];renderUnifList();return;
  }
  const ts=new Date().toISOString();
  const note=status==='pass'?null:(prev.note||null);
  try{
    if(prev.id){
      await q(sb.from('uniform_checks').update({status,note,updated_at:ts}).eq('id',prev.id));
      S.unifChecks[key]={...prev,status,note:note||'',violations:status==='pass'?[]:(prev.violations||[])};
    }else{
      const rows=await q(sb.from('uniform_checks').insert({student_id:stuId,date:S.unifDate,status,note,updated_at:ts}).select('id'));
      S.unifChecks[key]={id:rows[0].id,status,note:note||'',violations:[]};
    }
  }catch(e){toast('บันทึกไม่สำเร็จ: '+e.message,'er');return}
  renderUnifList();
}

async function setUnifViolationCheck(stuId,violId,checked){
  const chk=S.unifChecks[String(stuId)];if(!chk||chk.status!=='fail'||!chk.id)return;
  const vid=+violId;
  if(checked){
    try{
      await q(sb.from('uniform_check_violations').insert({check_id:chk.id,violation_id:vid}));
      if(!chk.violations)chk.violations=[];
      if(!chk.violations.includes(vid))chk.violations.push(vid);
    }catch(e){toast('บันทึกไม่สำเร็จ','er');}
  }else{
    try{
      await q(sb.from('uniform_check_violations').delete().eq('check_id',chk.id).eq('violation_id',vid));
      chk.violations=(chk.violations||[]).filter(v=>v!==vid);
    }catch(e){toast('ลบไม่สำเร็จ','er');}
  }
}

async function setUnifNote(stuId,note){
  const chk=S.unifChecks[String(stuId)];if(!chk||chk.status!=='fail')return;
  chk.note=note;
  if(chk.id){
    try{await q(sb.from('uniform_checks').update({note,updated_at:new Date().toISOString()}).eq('id',chk.id))}
    catch(e){}
  }
}

function renderUnifReport(){
  ['summary','class','school'].forEach(t=>$('unif-rpt-tab-'+t)?.classList.toggle('active',t===S.unifRptTab));
  if(S.unifRptTab==='summary') renderUnifRptSummary();
  else if(S.unifRptTab==='class') renderUnifRptClass();
  else renderUnifRptSchool();
}

        <td class="left" style="color:#111;font-weight:500;white-space:nowrap">${esc(s.student_name)}</td>
        <td>${statusBadge(d?.status)}</td>
        <td class="left" style="font-size:12px;color:#dc2626">${isFail&&d.viols.length?esc(d.viols.join(', ')):''}  </td>
        <td class="left" style="font-size:12px;color:#374151">${isFail?esc(d.note):''}</td>
      </tr>`;
    });
    body+=`</tbody></table></div>`;
    if(!rows.length)body+=`<div class="empty-state">ยังไม่มีข้อมูลการตรวจ</div>`;
    $('unif-rpt-class-doc').innerHTML=body;
  }catch(e){loading(false);$('unif-rpt-class-doc').innerHTML=`<div class="empty-state">โหลดข้อมูลไม่สำเร็จ<small>${esc(e.message)}</small></div>`}
}

// ── Uniform Report: ทั้งโรงเรียน ─────────────────────────────────────────────
async function renderUnifRptSchool(){
  const el=$('unif-rpt-content');
  let h=`<div class="section" style="padding-top:14px">
    <div class="unif-filter-card">
      <div class="unif-fc-row">
        <span class="unif-fc-lbl">วันที่</span>
        <input type="date" class="ios-select" style="flex:1" value="${S.unifRptDate}" onchange="S.unifRptDate=this.value;renderUnifRptSchool()">
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="btn bs" title="บันทึกรูป" onclick="_captureImage('unif-rpt-school-doc','รายงานแต่งกายโรงเรียน_${S.unifRptDate}.png')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
      </div>
    </div>`;
  el.innerHTML=h+`<div id="unif-rpt-school-doc"><div class="loading-text">กำลังโหลด...</div></div></div>`;
  loading(true);
  try{
    const rows=await q(sb.from('uniform_checks').select('student_id,status').eq('date',S.unifRptDate));
    loading(false);
    // Build per-class map
    const classMap={};
    S.classes.forEach(c=>{const k=`${c.grade_level}_${c.room}`;classMap[k]={gl:c.grade_level,r:c.room,pass:0,fail:0,absent:0,total:0}});
    const stuClass={};
    S.students.forEach(s=>{stuClass[String(s.id)]=`${s.grade_level}_${s.room}`});
    rows.forEach(r=>{
      const k=stuClass[String(r.student_id)];if(!k||!classMap[k])return;
      if(r.status==='pass')classMap[k].pass++;
      else if(r.status==='fail')classMap[k].fail++;
      else if(r.status==='absent')classMap[k].absent++;
    });
    // total students per class
    S.students.forEach(s=>{const k=`${s.grade_level}_${s.room}`;if(classMap[k])classMap[k].total++});
    const entries=Object.values(classMap).filter(c=>c.total>0);
    const pct=(n,d)=>d>0?Math.round(n/d*100)+'%':'—';
    let totPass=0,totFail=0,totAbsent=0,totRec=0,totStu=0;
    entries.forEach(c=>{const rec=c.pass+c.fail+c.absent;totPass+=c.pass;totFail+=c.fail;totAbsent+=c.absent;totRec+=rec;totStu+=c.total});

    let body=`<div class="unif-sr-header">
      <div class="unif-sr-school">${esc(S.schoolName||'')}</div>
      <div class="unif-sr-title">รายงานการตรวจการแต่งกาย — ทั้งโรงเรียน</div>
      <div class="unif-sr-date">${thDate(S.unifRptDate)}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px">
      <div class="stat-box s-all"><div class="stat-num">${totStu}</div><div class="stat-lbl">นักเรียนทั้งหมด</div></div>
      <div class="stat-box s-present"><div class="stat-num green">${totPass}</div><div class="stat-lbl">ผ่าน</div></div>
      <div class="stat-box s-absent"><div class="stat-num red">${totFail}</div><div class="stat-lbl">ไม่ผ่าน</div></div>
      <div class="stat-box s-late"><div class="stat-num orange">${totAbsent}</div><div class="stat-lbl">ขาด</div></div>
    </div>
    <div class="table-wrap"><table class="unif-rpt-table" style="background:#fff;color:#000">
      <thead><tr><th class="left nowrap" style="background:#f3f4f6;color:#111">ชั้นเรียน</th><th style="background:#f3f4f6;color:#111">นักเรียน</th><th style="background:#f3f4f6;color:#111">ผ่าน</th><th style="background:#f3f4f6;color:#111">ไม่ผ่าน</th><th style="background:#f3f4f6;color:#111">ขาด</th><th style="background:#f3f4f6;color:#111">%ผ่าน</th></tr></thead>
      <tbody>`;
    entries.forEach(c=>{
      const rec=c.pass+c.fail+c.absent;
      const pctNum=rec>0?c.pass/rec:null;
      const pctCls=pctNum===null?'grey':pctNum>=0.9?'green':'red';
      if(rec===0){
        body+=`<tr><td class="left nowrap">${classLabel(c.gl,c.r)}</td><td>${c.total}</td><td colspan="4" class="not-checked">ยังไม่ตรวจ</td></tr>`;
      }else{
        body+=`<tr>
          <td class="left nowrap">${classLabel(c.gl,c.r)}</td>
          <td>${c.total}</td>
          <td class="green">${c.pass}</td>
          <td class="red">${c.fail}</td>
          <td class="grey">${c.absent}</td>
          <td class="${pctCls}">${pct(c.pass,rec)}</td>
        </tr>`;
      }
    });
    body+=`<tr class="total-row">
      <td class="left">รวมทั้งหมด</td><td>${totStu}</td>
      <td class="green">${totPass}</td><td class="red">${totFail}</td>
      <td class="grey">${totAbsent}</td>
      <td>${pct(totPass,totRec)}</td>
    </tr>`;
    body+=`</tbody></table></div>`;
    if(!rows.length)body+=`<div class="empty-state">ยังไม่มีข้อมูลการตรวจในช่วงนี้</div>`;
    $('unif-rpt-school-doc').innerHTML=body;
  }catch(e){loading(false);$('unif-rpt-school-doc').innerHTML=`<div class="empty-state">โหลดข้อมูลไม่สำเร็จ<small>${esc(e.message)}</small></div>`}
}

// ─── VIOLATION CRUD ────────────────────────────────────────────────────────
function showViolationModal(id){
  const v=id?S.unifViolations.find(x=>x.id===id):null;
  $('modal-viol-id').value=id||'';
  $('modal-viol-name').value=v?.name||'';
  $('modal-viol-active').checked=v?v.is_active:true;
  $('violation-modal-title').textContent=id?'แก้ไขประเภทความผิด':'เพิ่มประเภทความผิด';
  $('violation-modal').classList.add('open');
  setTimeout(()=>$('modal-viol-name').focus(),100);
}
function closeViolationModal(){$('violation-modal').classList.remove('open')}

async function saveViolation(){
  const id=$('modal-viol-id').value;
  const name=$('modal-viol-name').value.trim();
  if(!name){toast('กรุณาใส่ชื่อประเภทความผิด','er');return}
  const payload={name,is_active:$('modal-viol-active').checked};
  loading(true);
  try{
    if(id) await q(sb.from('uniform_violations').update(payload).eq('id',+id));
    else    await q(sb.from('uniform_violations').insert(payload));
    await loadViolations();
    closeViolationModal();
    renderAdmin();
    toast(id?'แก้ไขเรียบร้อย':'เพิ่มประเภทความผิดแล้ว');
  }catch(e){toast('เกิดข้อผิดพลาด: '+e.message,'er')}
  finally{loading(false)}
}

async function deleteViolation(id){
  const v=S.unifViolations.find(x=>x.id===id);
  if(!confirm(`ลบ "${v?.name||''}"?`))return;
  loading(true);
  try{
    await q(sb.from('uniform_violations').delete().eq('id',id));
    await loadViolations();
    renderAdmin();
    toast('ลบแล้ว');
  }catch(e){toast('เกิดข้อผิดพลาด: '+e.message,'er')}
  finally{loading(false)}
}

async function loadAppData(){
  loading(true);
  try{
    const[actR,stuR,nameR,pinR]=await Promise.allSettled([loadActivities(),loadStudents(),loadSchoolName(),loadAdminPin(),loadViolations()]);
    if(actR.status==='rejected')throw actR.reason;
    if(stuR.status==='rejected')throw stuR.reason;
    const sn=$('side-school-name');if(sn)sn.textContent=S.schoolName;
    const ts=$('topbar-sub');if(ts)ts.textContent=S.schoolName;
    const firstActive=S.activities.find(a=>a.is_active);
    if(firstActive){S.ckActivityId=firstActive.id;S.rptActivityId=firstActive.id}
    nav('home');
  }catch(e){
    toast('โหลดข้อมูลไม่สำเร็จ: '+e.message,'er');
  }finally{loading(false)}
}

function _isDark(){
  const t=document.documentElement.getAttribute('data-theme');
  if(t==='dark')return true;
  if(t==='light')return false;
  return matchMedia('(prefers-color-scheme:dark)').matches;
}
function initTheme(){
  document.documentElement.setAttribute('data-theme','light');
  localStorage.removeItem('theme');
}

// ─── INIT ──────────────────────────────────────────────────────────────────
async function init(){
  // ตรวจสอบ session ที่มีอยู่แล้ว
  const{data:{session}}=await sb.auth.getSession();
  if(session){
    $('login-overlay').style.display='none';
    $('logout-btn').style.display='';
    await loadAppData();
  }
  // ไม่มี session → แสดง login overlay (default display:flex)
}
function startClock(){
  const D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function tick(){
    const n=new Date();
    const hh=String(n.getHours()).padStart(2,'0'),mm=String(n.getMinutes()).padStart(2,'0'),ss=String(n.getSeconds()).padStart(2,'0');
    const cd=$('clock-date'),ct=$('clock-time');if(!ct)return;
    cd.textContent=`วัน${D[n.getDay()]} ${n.getDate()} ${M[n.getMonth()]} ${n.getFullYear()+543}`;
    ct.textContent=`${hh}:${mm}:${ss}`;
    const ht=$('hclock-time'),hday=$('hclock-day'),hdt=$('hclock-date');
    if(ht)ht.textContent=`${hh}:${mm}:${ss}`;
    if(hday)hday.textContent=`วัน${D[n.getDay()]}`;
    if(hdt)hdt.textContent=`${n.getDate()} ${M[n.getMonth()]} ${n.getFullYear()+543}`;
  }
  tick();setInterval(tick,1000);
}
initTheme();
startClock();
init();
